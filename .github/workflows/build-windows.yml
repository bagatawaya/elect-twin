name: Build Windows v0.3.0 Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build & Package Windows Installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Freeze twin-server.exe
        run: |
          pyinstaller --noconfirm --onefile `
            --name twin-server `
            --add-data "elect-twin-mac/web;web" `
            --distpath elect-twin-windows/dist `
            --workpath elect-twin-windows/build/twin `
            --specpath elect-twin-windows/build `
            elect-twin-mac/twin.py

      - name: Freeze rooms-server.exe
        run: |
          pyinstaller --noconfirm --onefile `
            --name rooms-server `
            --add-data "elect-twin-windows/web;web" `
            --distpath elect-twin-windows/dist `
            --workpath elect-twin-windows/build/rooms `
            --specpath elect-twin-windows/build `
            elect-twin-windows/rooms_server.py

      - name: Test compiled Windows executables
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          ELECT_TWIN_ENGINE: "elect-twin-windows/dist/twin-server.exe"
          ELECT_TWIN_ROOMS_ENGINE: "elect-twin-windows/dist/rooms-server.exe"
        run: |
          python elect-twin-windows/test_rooms_server.py
          cd elect-twin-mac
          python tests/smoke_runtime.py
          python tests/smoke_rooms.py

      - name: Publish .NET 8 WebView2 Shell (ElectTwin.exe)
        run: |
          dotnet publish elect-twin-windows/ElectTwinWin/ElectTwinWin.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" elect-twin-windows/installer.iss

      - name: Generate SHA-256 sidecar
        shell: pwsh
        run: |
          $installer = "elect-twin-windows/dist/Elect-Twin-Setup-0.3.0-x64.exe"
          $hash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  Elect-Twin-Setup-0.3.0-x64.exe" | Out-File -FilePath "elect-twin-windows/dist/Elect-Twin-Setup-0.3.0-x64.exe.sha256" -Encoding ascii
          Write-Host "Generated installer SHA-256: $hash"

      - name: Upload Windows Setup Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Elect-Twin-Windows-0.3.0-Setup
          path: |
            elect-twin-windows/dist/Elect-Twin-Setup-0.3.0-x64.exe
            elect-twin-windows/dist/Elect-Twin-Setup-0.3.0-x64.exe.sha256

      - name: Attach Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            elect-twin-windows/dist/Elect-Twin-Setup-0.3.0-x64.exe
            elect-twin-windows/dist/Elect-Twin-Setup-0.3.0-x64.exe.sha256
